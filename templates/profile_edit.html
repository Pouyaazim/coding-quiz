<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ویرایش پروفایل</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            border: 1px solid #334155;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.6rem;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 0.9rem;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            font-size: 1rem;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .hint {
            color: #64748b;
            font-size: 0.8rem;
            margin-top: -12px;
            margin-bottom: 18px;
        }

        /* Avatar section */
        .avatar-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            padding: 20px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .avatar-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            flex-shrink: 0;
            overflow: hidden;
            border: 3px solid #334155;
        }
        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .avatar-controls {
            flex: 1;
        }
        .avatar-controls label {
            margin-bottom: 6px;
        }
        input[type="file"] {
            font-size: 0.85rem;
            color: #94a3b8;
            width: 100%;
        }
        input[type="file"]::file-selector-button {
            padding: 8px 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            margin-left: 10px;
            font-size: 0.85rem;
        }
        input[type="file"]::file-selector-button:hover {
            background: #2563eb;
        }
        .checkbox-line {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 0.85rem;
            color: #f87171;
            cursor: pointer;
        }
        .checkbox-line input {
            width: auto;
            margin: 0;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            font-family: inherit;
            margin-top: 10px;
        }
        button[type="submit"]:hover {
            background: #2563eb;
        }
        .msg {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
        .error {
            background: #7f1d1d;
            color: #fecaca;
        }
        .success {
            background: #14532d;
            color: #bbf7d0;
        }
        .back {
            text-align: center;
            margin-top: 20px;
        }
        .back a {
            color: #60a5fa;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>✏️ ویرایش پروفایل</h1>

        {% if error %}
        <div class="msg error">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="msg success">{{ success }}</div>
        {% endif %}

        <form method="POST" action="/profile/edit" enctype="multipart/form-data">

            <!-- Avatar -->
            <div class="avatar-section">
                <div class="avatar-preview">
                    {% if user.avatar %}
                        <img src="/static/avatars/{{ user.avatar }}" alt="avatar">
                    {% else %}
                        {{ user.username[0] | upper }}
                    {% endif %}
                </div>
                <div class="avatar-controls">
                    <label>عکس پروفایل</label>
                    <input type="file" name="avatar" accept="image/*">
                    {% if user.avatar %}
                    <label class="checkbox-line">
                        <input type="checkbox" name="remove_avatar" value="yes">
                        حذف عکس فعلی
                    </label>
                    {% endif %}
                    <div class="hint" style="margin-top: 10px;">حداکثر ۲ مگابایت — jpg, png, gif, webp</div>
                </div>
            </div>

            <label>نام کاربری</label>
            <input type="text" value="{{ user.username }}" disabled>
            <div class="hint">نام کاربری قابل تغییر نیست</div>

            <label>ایمیل</label>
            <input type="email" name="email" value="{{ user.email }}" required>

            <label>رمز فعلی</label>
            <input type="password" name="current_password" placeholder="اگه نمیخوای رمز رو عوض کنی، خالی بذار">

            <label>رمز جدید</label>
            <input type="password" name="new_password" placeholder="حداقل ۶ کاراکتر">

            <button type="submit">ذخیره تغییرات</button>
        </form>

        <div class="back">
            <a href="/profile">← برگشت به پروفایل</a>
        </div>
    </div>
</body>
</html>
