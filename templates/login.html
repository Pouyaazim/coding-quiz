{% extends "base.html" %}

{% block title %}ورود — Coding Quiz{% endblock %}
{% block container_class %}container-narrow{% endblock %}

{% block content %}
<div class="glass-card tilt-card reveal-scale" style="padding: 50px 40px; max-width: 480px; margin: 0 auto;">
    <div class="tilt-glare"></div>
    <div class="tilt-inner">

        <h1 class="hero-title text-shimmer reveal" style="font-size: 2.2rem;">
            ورود 🎮
        </h1>
        <p class="hero-subtitle reveal" style="transition-delay: 0.1s;">خوش برگشتی!</p>

        {% if error %}
            <div class="alert alert-error reveal" style="transition-delay: 0.15s;">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="input-group reveal" style="transition-delay: 0.2s;">
                <label class="input-label">نام کاربری</label>
                <input type="text" name="username" class="input" required autofocus>
            </div>

            <div class="input-group reveal" style="transition-delay: 0.3s;">
                <label class="input-label">رمز عبور</label>
                <input type="password" name="password" class="input" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg btn-shine glow-pulse reveal" style="transition-delay: 0.4s;">
                ورود
            </button>
        </form>

        <p class="text-center mt-3 text-secondary reveal" style="transition-delay: 0.5s;">
            حساب نداری؟ <a href="/register" class="link">ثبت‌نام کن</a>
        </p>

    </div>
</div>
{% endblock %}
