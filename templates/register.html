<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ثبت‌نام</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background: #2563eb;
        }
        .error {
            background: #7f1d1d;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #fecaca;
        }
        .link {
            text-align: center;
            margin-top: 20px;
        }
        .link a {
            color: #60a5fa;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>ثبت‌نام</h1>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/register">
            <label>نام کاربری</label>
            <input type="text" name="username" required>

            <label>ایمیل</label>
            <input type="email" name="email" required>

            <label>رمز عبور</label>
            <input type="password" name="password" required>

            <button type="submit">ثبت‌نام</button>
        </form>

        <div class="link">
            حساب داری؟ <a href="/login">وارد شو</a>
        </div>
    </div>
</body>
</html>
