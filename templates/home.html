<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Coding Quiz</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 40px 60px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 1.2rem;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 1rem;
        }
        a:hover {
            background: #2563eb;
        }
        .gray {
            background: #475569;
        }
        .gray:hover {
            background: #334155;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎮 Coding Quiz</h1>

        {% if user %}
            <p>خوش اومدی، <strong>{{ user.username }}</strong>! 🎉</p>
            <p>امتیاز: {{ user.xp }} | سطح: {{ user.level }}</p>
            <a href="/logout" class="gray">خروج</a>
        {% else %}
            <p>به بازی-آموزش برنامه‌نویسی خوش اومدی!</p>
            <a href="/register">ثبت‌نام</a>
            <a href="/login" class="gray">ورود</a>
        {% endif %}
    </div>
</body>
</html>
