<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>کوییز</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
        }
        .meta {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .question {
            font-size: 1.3rem;
            margin-bottom: 30px;
            line-height: 1.8;
        }
        .option {
            display: block;
            padding: 15px 20px;
            margin-bottom: 12px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option:hover {
            border-color: #3b82f6;
        }
        .option input {
            display: none;
        }
        .option input:checked + span {
            color: #60a5fa;
            font-weight: bold;
        }
        .option:has(input:checked) {
            border-color: #3b82f6;
            background: #1e3a8a33;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="meta">
            دسته: {{ question.category }} |
            سطح: {{ question.difficulty }} |
            جایزه: {{ question.xp_reward }} XP
        </div>

        <div class="question">{{ question.text }}</div>

        <form method="POST" action="/quiz/{{ question.id }}">
            <label class="option">
                <input type="radio" name="selected_option" value="a" required>
                <span>{{ question.option_a }}</span>
            </label>
            <label class="option">
                <input type="radio" name="selected_option" value="b">
                <span>{{ question.option_b }}</span>
            </label>
            <label class="option">
                <input type="radio" name="selected_option" value="c">
                <span>{{ question.option_c }}</span>
            </label>
            <label class="option">
                <input type="radio" name="selected_option" value="d">
                <span>{{ question.option_d }}</span>
            </label>

            <button type="submit">ثبت جواب</button>
        </form>
    </div>
</body>
</html>
