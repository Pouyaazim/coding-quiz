<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نتیجه</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 40px 60px;
            border-radius: 20px;
            text-align: center;
        }
        .correct {
            color: #4ade80;
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .wrong {
            color: #f87171;
            font-size: 3rem;
            margin-bottom: 10px;
        }
        h1 {
            margin: 10px 0;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }
        a:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div class="card">
        {% if is_correct %}
            <div class="correct">✅</div>
            <h1>درست بود!</h1>
            <p>+{{ xp_reward }} XP گرفتی 🎉</p>
            <p>امتیاز کل: {{ new_xp }} | سطح: {{ new_level }}</p>
        {% else %}
            <div class="wrong">❌</div>
            <h1>اشتباه بود</h1>
            <p>جواب درست: <strong>{{ correct_answer }}</strong></p>
            <p>امتیاز کل: {{ new_xp }}</p>
        {% endif %}

        <a href="/quiz">سوال بعدی</a>
    </div>
</body>
</html>
