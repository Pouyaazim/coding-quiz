<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نتیجه</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 40px 50px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 10px;
        }
        h1 {
            margin: 10px 0;
        }
        p {
            color: #94a3b8;
            font-size: 1.05rem;
        }
        .xp-earned {
            color: #4ade80;
            font-size: 1.3rem;
            font-weight: bold;
            margin: 15px 0;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }
        a:hover { background: #2563eb; }

        .level-box {
            background: #0f172a;
            padding: 18px;
            border-radius: 12px;
            margin: 20px 0;
            border: 1px solid #334155;
        }
        .level-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .level-badge {
            background: linear-gradient(135deg, #7c3aed, #3b82f6);
            padding: 5px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .xp-text {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        .xp-text strong {
            color: #60a5fa;
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #7c3aed);
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="card">
        {% if is_correct %}
            <div class="icon">✅</div>
            <h1>درست بود!</h1>
            <p class="xp-earned">+{{ xp_reward }} XP 🎉</p>
        {% else %}
            <div class="icon">❌</div>
            <h1>اشتباه بود</h1>
            <p>جواب درست: <strong style="color: #4ade80;">{{ correct_answer }}</strong></p>
        {% endif %}

        <div class="level-box">
            <div class="level-header">
                <span class="level-badge">سطح {{ progress.level }}</span>
                <span class="xp-text"><strong>{{ progress.xp_current }}</strong> XP</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width: {{ progress.progress }}%;"></div>
            </div>
            <div class="progress-label">
                <span>{{ progress.xp_in_level }} / {{ progress.xp_needed }}</span>
                <span>{{ progress.progress }}٪</span>
            </div>
        </div>

        <a href="/quiz">سوال بعدی</a>
    </div>
</body>
</html>
